name: Refresh source snapshot every 3 days

on:
  schedule:
    # Check daily so the three-day interval continues across month boundaries.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-source-snapshot
  cancel-in-progress: false

jobs:
  cadence:
    runs-on: ubuntu-latest
    outputs:
      run_refresh: ${{ steps.check.outputs.run_refresh }}
    steps:
      - id: check
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          anchor=$(date -u -d '2026-10-10 00:00:00 UTC' +%s)
          days_since_anchor=$(( ($(date -u +%s) - anchor) / 86400 ))
          if (( days_since_anchor >= 3 && days_since_anchor % 3 == 0 )); then
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_refresh=false" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: cadence
    if: needs.cadence.outputs.run_refresh == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify-sources
      - run: npm run prebuild-data
      - run: npm run build
      - name: Commit updated snapshot
        run: |
          git add public/opportunities.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh opportunity snapshot"
            git push
          fi
